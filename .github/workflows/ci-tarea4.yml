name: CI - Tarea4

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tarea-4-concurrencia-kafka
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build, test and generate JaCoCo analysis
        run: mvn -B -DskipTests=false test jacoco:report

      - name: Package application
        run: mvn -B -DskipTests package

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: tarea-4-concurrencia-kafka/target/site/jacoco

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: t4-concurrencia-kafka-jar
          path: tarea-4-concurrencia-kafka/target/*.jar

  deploy-container:
    runs-on: ubuntu-latest
    needs: build-test-analysis
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/t4-concurrencia-kafka
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and deploy Docker image
        uses: docker/build-push-action@v5
        with:
          context: tarea-4-concurrencia-kafka
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
