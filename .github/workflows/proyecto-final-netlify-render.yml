name: Proyecto Final Netlify Render Supabase

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'proyecto-final/**'
      - 'netlify.toml'
      - 'render.yaml'
      - '.github/workflows/proyecto-final-netlify-render.yml'

permissions:
  contents: read

concurrency:
  group: proyecto-final-presentation
  cancel-in-progress: true

env:
  PROJECT_DIR: proyecto-final
  NETLIFY_FRONTEND_DIR: proyecto-final/src/main/resources/static

jobs:
  verify-backend:
    name: Verify Spring Boot backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify
        run: mvn -B verify

  deploy-netlify:
    name: Deploy static frontend to Netlify
    runs-on: ubuntu-latest
    needs: verify-backend
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are required to deploy."
            exit 1
          fi
          npx --yes netlify-cli deploy \
            --prod \
            --dir "$NETLIFY_FRONTEND_DIR" \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "Proyecto Final frontend $GITHUB_SHA"

  deploy-render:
    name: Trigger Render backend deploy
    runs-on: ubuntu-latest
    needs: verify-backend
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping Render deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"